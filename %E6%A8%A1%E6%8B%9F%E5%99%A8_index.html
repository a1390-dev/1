  function renderInstagram(){
    currentApp='instagram';currentPage=igMode; const name=CONFIG.instagram.callerName||'imwinter';
    if(igMode==='profile'){
      const body=`<div class="app-scroll"><div class="ig-profile-head"><div class="ig-profile-row">${avatar('旼','large')}<div class="ig-profile-stats"><div><b>425</b>帖子</div><div><b>1,820万</b>粉丝</div><div><b>5</b>关注</div></div></div><div class="profile-name" style="margin-top:12px">${escapeHtml(name)}</div><div class="ig-bio">WINTER · aespa<br>☾ 오늘의 기록은 내일의 기억</div>
      <div style="margin:14px 0 10px;padding:13px;border:1px solid #e6e6ea;border-radius:13px;background:#fff">
        <div style="display:flex;align-items:center;gap:12px">
          <img src="${memberAvatarData['A']}" alt="aespa_official" style="width:72px;height:72px;object-fit:cover;border-radius:50%;border:2px solid #f4a3d9">
          <div style="flex:1;min-width:0"><b style="font-size:15px">aespa_official <span style="color:#1688e8">✿</span></b><div style="font-size:12px;color:#555;margin-top:3px">aespa 에스파</div><div style="font-size:11px;color:#777;margin-top:5px">4,355 帖子　1,700 万粉丝　5 关注</div></div>
        </div>
        <div style="font-size:12px;line-height:1.5;margin-top:9px">aespa 에스파 The 1st Japan Mini Album 【KISS N TELL】<br>↗ 2026.07.24 0AM (KST/JST)</div>
        <button data-action="ig-official" style="margin-top:8px;width:100%;padding:8px;border-radius:9px;background:#f2f2f6;font-weight:700">查看官方账号动态</button>
      </div>
      <div style="font-weight:800;font-size:14px;margin:16px 0 8px">关注的账号 · Following</div>
      <div style="display:flex;flex-direction:column;gap:0;border:1px solid #ececf0;border-radius:12px;overflow:hidden;background:white;margin-bottom:12px">
        ${[
          ['G','aerichandesu','GISELLE'],
          ['K','katarinabluu','KARINA'],
          ['SM','smtown','SM Entertainment Group'],
          ['N','imnotningning','NINGNING'],
          ['旼','imwinter','WINTER']
        ].map(([key,handle,label])=>`<button data-action="ig-account" data-handle="${handle}" style="display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid #f0f0f2;background:white;color:#17171b"><img src="${memberAvatarData[key]}" alt="${label}" style="width:54px;height:54px;object-fit:cover;border-radius:50%"><span style="min-width:0"><b style="font-size:14px">${handle} <span style="color:#1688e8">✿</span></b><small style="display:block;color:#7b7e86;margin-top:3px">${label}</small></span></button>`).join('')}
      </div><label class="avatar-upload">上传成员头像图片（本机预览）<input type="file" id="avatarUpload" accept="image/*" multiple style="display:block;margin-top:8px"></label><button data-action="ig-reels" style="width:100%;border-radius:9px;background:#eeeef3;padding:10px;margin:8px 0;font-weight:700">▶ 返回 Reels 刷视频</button><button data-action="ring-again" style="width:100%;border-radius:9px;background:#eeeef3;padding:10px;margin-bottom:10px;font-weight:700">视频通话</button><div class="ig-post-grid">${Array.from({length:9},(_,i)=>`<div class="ig-post-cell" data-photo="${i}">✦</div>`).join('')}</div></div></div>`;
      view.innerHTML=shell('Instagram','个人主页',body,{actions:'<button class="top-action" data-action="ig-reels">▶</button>'}); return;
    }
    const feed=[...localReels];
    const intro=`<input type="file" id="reelUpload" accept="video/*" multiple style="display:none">`;
    const cards=feed.length?feed.map((r,i)=>`<section class="ig-reel"><video src="${r.url}" controls playsinline muted autoplay loop preload="metadata"></video><div class="ig-reel-overlay"><div class="ig-reel-caption"><b>WINTER · imwinter</b><div>WINTER · 原视频</div><small>WINTER · 原视频</small></div><div class="ig-reel-actions"><button data-action="ig-like">♡</button><button data-action="ig-comment">▢</button><button data-action="ig-share">↗</button></div></div></section>`).join(''):`<section class="ig-reel"><div style="position:relative;z-index:1;text-align:center"><div style="font-size:48px">▶</div><b>你的 Reels 视频流</b><p style="font-size:12px;line-height:1.7;color:#eee">现在还没有导入真实视频。点上方“添加视频”，选择你发来的成员视频，即可在这里连续上下滑动播放。</p><button data-action="ig-profile" style="background:#fff;color:#111;padding:10px 16px;border-radius:20px">打开主页</button></div></section>`;
    view.innerHTML=`<div class="app-screen" style="background:#09090b;color:white"><div class="app-top" style="background:#09090b;color:white;border-color:#333"><div class="app-title">Instagram<small>Reels · 短视频</small></div><div class="top-actions"><button class="top-action" data-action="ig-upload" aria-label="添加视频">＋</button><button class="top-action" data-action="ig-profile">♙</button><button class="top-action" data-action="home">⌂</button></div></div>${intro}<div class="ig-reel-feed" id="igReelFeed" style="flex:1;min-height:0;height:auto">${cards}</div><div class="app-homebar light"></div></div>`;
    const reelFeed=$('#igReelFeed');
    if(reelFeed && 'IntersectionObserver' in window){
      const reelObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
        const v=entry.target.querySelector('video'); if(!v)return;
        if(entry.isIntersecting && entry.intersectionRatio>.65){v.muted=true;v.play().catch(()=>{});}
        else v.pause();
      }),{root:reelFeed,threshold:[.25,.65,.9]});
      reelFeed.querySelectorAll('.ig-reel').forEach(card=>reelObserver.observe(card));
    } else if(reelFeed) reelFeed.querySelectorAll('video').forEach(v=>v.play().catch(()=>{}));
  }
  function renderPhotos(){currentApp='photos';currentPage='list';const tiles=(CONFIG.photos||[]).map((p,i)=>`<div class="photo-tile" data-photo="${i}"><span>${['✦','☁','▧','♫','◌','☾'][i%6]}</span></div>`).join('');view.innerHTML=shell('사진','相册',`<div class="app-scroll"><div style="padding:13px 14px;font-size:13px;font-weight:800">최근 항목 · 最近项目</div><div class="photo-grid">${tiles}</div><div style="padding:13px 14px;color:#888;font-size:11px">画面为占位预览。点开某张后才显示对应的说明。</div></div>`,{actions:'<button class="top-action" data-action="noop">선택</button>'});}

  function sendChat(){
    const input=$('#chatInput'); if(!input)return; const val=input.value.trim(); if(!val)return;
    const chosenContact=chatContact; const npc=chosenContact?.name||'김민정'; const msgs=fullChat(chosenContact);
    const now=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    msgs.push({from:'我',time:now,text:val,zh:''}); persistChats(); input.value='';
    // Real chat layout: message is sent first, then the contact types for a plausible interval.
    chatTypingFor=npc; renderKakao(false,chosenContact);
    if(kktNpcAutonomyTimer)clearTimeout(kktNpcAutonomyTimer);
    const matchedTrigger=npc==='김민정'?detectKktTrigger(val):null;
    let reply=contextualReply(npc,val);
    if(matchedTrigger){
      const pair=matchedTrigger.replies[Math.floor(Math.random()*matchedTrigger.replies.length)];
      reply={text:pair[0],zh:pair[1]};
    }
    const delay=Math.min(2800,900+Math.min(900,val.length*35)+Math.floor(Math.random()*700));
    setTimeout(()=>{
      const arr=fullChat(chosenContact);
      const tm=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      arr.push({from:npc,time:tm,text:reply.text,zh:reply.zh}); persistChats();
      if(chatTypingFor===npc)chatTypingFor='';
      if(currentApp==='kakao'&&currentPage==='chat'&&chatContact?.name===npc)renderKakao(false,chosenContact);
    },delay);
  }

  homeBar.addEventListener('click',()=>{if(currentApp==='instagram-call'||currentApp==='instagram-video')endCall();else homeAction();});
  homeBar.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();homeBar.click();}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(currentApp==='instagram-call'||currentApp==='instagram-video')endCall();else homeAction();}if(e.key==='Enter'&&document.activeElement===$('#chatInput'))sendChat();});
  // Local video audio is opt-in after the user taps the screen, matching mobile browser autoplay rules.
  setWallpaper();updateClock();setInterval(updateClock,1000);renderLock();

  document.addEventListener("change", (ev) => {
    if(ev.target && ev.target.id==='reelUpload' && ev.target.files){
      [...ev.target.files].forEach(file=>localReels.push({url:URL.createObjectURL(file),fileName:file.name,name:'WINTER · imwinter',caption:'WINTER · 原视频'}));
      igMode='reels'; renderInstagram(); showToast('视频已加入','已加入本地 Reels 视频流，可以上下滑动浏览。');
    }
    if(ev.target && ev.target.id==='avatarUpload' && ev.target.files){
      const keys=['旼','K','G','N','T','S','I','W','J','M','H','SM','♡','✦'];
      [...ev.target.files].forEach((file,i)=>{const reader=new FileReader();reader.onload=()=>{memberAvatarData[keys[i]||file.name]=reader.result;if(currentApp==='instagram'&&igMode==='profile')renderInstagram();showToast('头像已载入',`${file.name} 已载入本机预览；按选择顺序对应联系人。`);};reader.readAsDataURL(file);});
    }
    if(ev.target && ev.target.id==='youtubeUpload' && ev.target.files){
      const box=$('#uploadedSocialVideos'); if(box){[...ev.target.files].forEach(file=>{const wrap=document.createElement('div');wrap.className='social-post';const v=document.createElement('video');v.src=URL.createObjectURL(file);v.controls=true;v.playsInline=true;v.style.cssText='width:100%;max-height:360px;border-radius:10px;background:#111';const label=document.createElement('div');label.textContent=file.name;label.style.cssText='font-size:12px;font-weight:700;margin:8px 0';wrap.append(v,label);box.prepend(wrap);});showToast('视频已导入','已加入当前 YouTube 模拟页，可直接播放。');}
    }
  });

})();
</script>

<script>
/* 安全初始化：如果本次页面从锁屏启动，触发库仅在KKT聊天页面打开；不修改原始聊天记录。 */
document.addEventListener('visibilitychange',()=>{ if(document.hidden && kktNpcAutonomyTimer) clearTimeout(kktNpcAutonomyTimer); });
</script>
</body>
